<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AAF-AIOS Chat</title>
  <style>
    :root {
      --bg-main: #212121;
      --bg-sidebar: #171717;
      --bg-input: #2f2f2f;
      --border: #424242;
      --text-primary: #ececec;
      --text-secondary: #b4b4b4;
      --accent: #ffffff;
      --accent-text: #000000;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-main);
      color: var(--text-primary);
      height: 100vh;
      display: flex;
      overflow: hidden;
    }

    /* Sidebar */
    .sidebar {
      width: 260px;
      background-color: var(--bg-sidebar);
      display: flex;
      flex-direction: column;
      padding: 12px;
      transition: transform 0.3s ease;
      flex-shrink: 0;
    }
    
    .new-chat-btn {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
      color: var(--text-primary);
      background: transparent;
      border: none;
      transition: background 0.2s;
      width: 100%;
    }
    
    .new-chat-btn:hover { background-color: var(--bg-input); }
    
    .new-chat-btn svg {
      width: 16px;
      height: 16px;
      fill: currentColor;
    }

    .history-list {
      flex: 1;
      overflow-y: auto;
      margin-top: 24px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    
    .history-item {
      padding: 10px 12px;
      font-size: 14px;
      color: var(--text-primary);
      text-overflow: ellipsis;
      white-space: nowrap;
      overflow: hidden;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .history-item:hover { background-color: var(--bg-input); }

    .bottom-sidebar {
      margin-top: auto;
      padding-top: 12px;
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 14px;
      font-weight: 500;
    }
    .avatar-sm {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: linear-gradient(135deg, #a855f7, #ec4899);
      flex-shrink: 0;
    }

    /* Main Chat Area */
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      position: relative;
      height: 100%;
      min-width: 0; /* allows flex children to shrink */
    }
    
    .topbar {
      height: 48px;
      display: flex;
      align-items: center;
      padding: 0 16px;
      font-weight: 500;
      font-size: 14px;
      color: var(--text-secondary);
      border-bottom: 1px solid transparent;
    }

    .chat-container {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 0 16px;
      scroll-behavior: smooth;
    }
    
    .chat-content {
      width: 100%;
      max-width: 800px;
      display: flex;
      flex-direction: column;
      padding-bottom: 20px;
    }

    /* Welcome Screen */
    .welcome-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      width: 100%;
      max-width: 800px;
      margin: auto;
      flex: 1;
    }
    .logo-large {
      width: 72px;
      height: 72px;
      background: var(--accent);
      color: var(--accent-text);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      font-weight: bold;
      margin-bottom: 24px;
    }
    .welcome-title {
      font-size: 24px;
      font-weight: 600;
      margin-bottom: 32px;
    }
    .suggestion-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      width: 100%;
    }
    .suggestion-card {
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      cursor: pointer;
      transition: background 0.2s;
      text-align: left;
      background: transparent;
      color: var(--text-primary);
    }
    .suggestion-card:hover { background-color: var(--bg-input); }
    .suggestion-card .title {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 4px;
    }
    .suggestion-card .subtitle {
      font-size: 14px;
      color: var(--text-secondary);
    }

    /* Chat Messages */
    .message {
      padding: 24px 0;
      width: 100%;
      display: flex;
      gap: 16px;
    }
    .message.user { justify-content: flex-end; }
    .message.assistant { justify-content: flex-start; }
    
    .message-bubble {
      max-width: 80%;
      font-size: 16px;
      line-height: 1.6;
      word-wrap: break-word;
      white-space: pre-wrap;
    }
    
    .message.user .message-bubble {
      background-color: var(--bg-input);
      padding: 12px 20px;
      border-radius: 24px;
    }
    
    .message.assistant .message-bubble {
      padding: 4px 0;
      width: 100%;
    }
    
    .avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: bold;
    }
    .avatar.assistant {
      background: var(--accent);
      color: var(--accent-text);
      box-shadow: 0 0 0 1px rgba(255,255,255,0.1);
    }

    /* Artifacts / Reports */
    .artifact-box {
      margin-top: 16px;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      background: var(--bg-sidebar);
      font-size: 14px;
      width: 100%;
      overflow-x: auto;
    }
    .artifact-box strong {
      display: block;
      margin-bottom: 8px;
    }
    .artifact-box pre {
      white-space: pre-wrap;
      font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
      font-size: 13px;
      color: var(--text-secondary);
    }
    
    .artifact-box img,
    .artifact-box iframe {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: #fff;
      margin-top: 8px;
    }
    .artifact-box img { max-height: 340px; object-fit: contain; }
    .artifact-box iframe { height: 340px; }
    
    .artifact-box a {
      color: #60a5fa;
      text-decoration: none;
      display: inline-block;
      margin-top: 8px;
    }
    .artifact-box a:hover { text-decoration: underline; }

    /* Input Area */
    .input-area {
      position: relative;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 0 16px 24px;
      background: linear-gradient(180deg, transparent, var(--bg-main) 20%);
    }
    .input-container {
      width: 100%;
      max-width: 800px;
      background-color: var(--bg-input);
      border: 1px solid var(--border);
      border-radius: 26px;
      display: flex;
      align-items: flex-end;
      padding: 8px 12px;
      box-shadow: 0 0 15px rgba(0,0,0,0.1);
    }
    .input-container textarea {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text-primary);
      font-family: inherit;
      font-size: 16px;
      line-height: 24px;
      max-height: 200px;
      resize: none;
      padding: 8px;
      margin: 0 8px;
    }
    .action-btn {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: none;
      background: transparent;
      color: var(--text-primary);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
      margin-bottom: 4px;
    }
    .action-btn:hover { background-color: var(--border); }
    .action-btn svg { width: 18px; height: 18px; fill: currentColor; }
    
    .send-btn {
      background: var(--accent);
      color: var(--accent-text);
      margin-left: auto;
    }
    .send-btn:hover {
      opacity: 0.9;
      background: var(--accent);
    }
    .send-btn:disabled {
      background: var(--border);
      color: var(--text-secondary);
      cursor: not-allowed;
    }
    .disclaimer {
      font-size: 12px;
      color: var(--text-secondary);
      margin-top: 12px;
      text-align: center;
    }

    .hidden { display: none !important; }

    /* Typing indicator */
    .typing-indicator {
      display: flex;
      gap: 4px;
      align-items: center;
      padding: 8px 0;
    }
    .typing-dot {
      width: 6px;
      height: 6px;
      background: var(--text-secondary);
      border-radius: 50%;
      animation: typing 1.4s infinite ease-in-out both;
    }
    .typing-dot:nth-child(1) { animation-delay: -0.32s; }
    .typing-dot:nth-child(2) { animation-delay: -0.16s; }
    @keyframes typing {
      0%, 80%, 100% { transform: scale(0); }
      40% { transform: scale(1); }
    }

    @media (max-width: 768px) {
      .sidebar { display: none; }
      .suggestion-grid { grid-template-columns: 1fr; }
    }
    
    /* Utility */
    .controls-row {
      display: flex;
      gap: 12px;
      padding: 0 16px;
      margin-bottom: 8px;
      width: 100%;
      max-width: 800px;
    }
    .toggle-debug {
      font-size: 12px;
      color: var(--text-secondary);
      .markdown-content img {
        max-width: 100%;
        border-radius: 8px;
        margin: 8px 0;
      }
      .markdown-content h1, .markdown-content h2 {
        margin: 12px 0 8px 0;
        color: #fff;
      }
      .markdown-content p {
        margin-bottom: 8px;
        line-height: 1.5;
      }
      .artifact-box img {
        width: 100%;
        border-radius: 8px;
        margin-top: 8px;
        border: 1px solid #444;
      }
    }
  </style>
</head>
<body>
  
  <aside class="sidebar">
    <button class="new-chat-btn" id="newChatBtn">
      <span style="display: flex; align-items: center; gap: 8px;">
        <div class="avatar-sm" style="width: 24px; height: 24px; background: transparent; border: 1px solid var(--border); display: flex; justify-content: center; align-items: center; border-radius: 50%;">
          <svg viewBox="0 0 24 24" style="width: 14px; height: 14px;"><path d="M12 2.5L13.9 9.1L20.5 11L13.9 12.9L12 19.5L10.1 12.9L3.5 11L10.1 9.1L12 2.5Z" fill="currentColor"/></svg>
        </div>
        New chat
      </span>
      <svg viewBox="0 0 24 24"><path d="M12 5v14m-7-7h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </button>
    
    <div class="history-list" id="historyList">
      <!-- History items will be populated here -->
      <div class="history-item">Recent conversation...</div>
    </div>
    
    <div class="bottom-sidebar">
      <div class="avatar-sm"></div>
      <span>User</span>
    </div>
  </aside>

  <main class="main">
    <div class="topbar">
      <span>ChatGPT 3.5</span>
    </div>

    <div class="chat-container" id="chatContainer">
      <div class="chat-content" id="chatContent">
        
        <div class="welcome-screen" id="welcomeScreen">
          <div class="logo-large">AI</div>
          <h1 class="welcome-title">How can I help you today?</h1>
          
          <div class="suggestion-grid">
            <button class="suggestion-card" data-prompt="Write a to-do list for a personal project or task">
              <div class="title">Plan a project</div>
              <div class="subtitle">Write a to-do list for a task</div>
            </button>
            <button class="suggestion-card" data-prompt="Generate an email reply to a job offer">
              <div class="title">Write an email</div>
              <div class="subtitle">Reply to a job offer</div>
            </button>
            <button class="suggestion-card" data-prompt="Summarize this article or text for me in one paragraph">
              <div class="title">Summarize text</div>
              <div class="subtitle">Extract key points</div>
            </button>
            <button class="suggestion-card" data-prompt="How does AI work in a technical capacity">
              <div class="title">Explain concepts</div>
              <div class="subtitle">How AI works technically</div>
            </button>
          </div>
        </div>
        
        <!-- Messages will be appended here -->
      </div>
    </div>

    <div class="input-area">
      <div class="controls-row">
        <label class="toggle-debug">
          <input type="checkbox" id="debugMode" /> Debug Mode
        </label>
      </div>
      
      <div class="input-container">
        <!-- Attachment button -->
        <button class="action-btn" id="fileBtn" aria-label="Attach file">
          <svg viewBox="0 0 24 24"><path d="M21.586 10.461l-10.05 10.075c-1.95 1.959-5.122 1.959-7.071 0-1.95-1.96-1.95-5.122 0-7.081l10.606-10.606c1.17-1.17 3.073-1.17 4.243 0 1.169 1.17 1.169 3.073 0 4.242l-8.507 8.51c-.39.39-1.024.39-1.414 0-.39-.39-.39-1.023 0-1.414l7.07-7.071-1.414-1.414-7.071 7.07c-1.17 1.17-1.17 3.073 0 4.243 1.17 1.17 3.073 1.17 4.243 0l8.506-8.507c1.95-1.959 1.95-5.122 0-7.08-1.951-1.96-5.122-1.96-7.071 0l-10.608 10.605c-2.73 2.73-2.73 7.159 0 9.889 2.73 2.73 7.158 2.73 9.888 0l10.05-10.075-1.414-1.414z" fill="currentColor"/></svg>
        </button>
        <input id="uploadFile" type="file" class="hidden" accept=".txt,.csv,.json" />
        
        <textarea id="prompt" rows="1" placeholder="Message AAF-AIOS..."></textarea>
        
        <button class="action-btn send-btn" id="sendBtn" disabled aria-label="Send message">
          <svg viewBox="0 0 24 24"><path d="M12 4l-8 8h6v8h4v-8h6z" fill="currentColor"/></svg>
        </button>
      </div>
      <div class="disclaimer">
        AAF-AIOS can make mistakes. Consider verifying important information.
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script>
    const $ = (id) => document.getElementById(id);

    const promptEl = $('prompt');
    const sendBtn = $('sendBtn');
    const chatContent = $('chatContent');
    const chatContainer = $('chatContainer');
    const welcomeScreen = $('welcomeScreen');
    const fileBtn = $('fileBtn');
    const uploadFile = $('uploadFile');
    const newChatBtn = $('newChatBtn');
    const debugMode = $('debugMode');

    let currentRequest = null;

    // Auto-resize textarea
    promptEl.addEventListener('input', function() {
      this.style.height = 'auto';
      this.style.height = (this.scrollHeight) + 'px';
      
      if (this.value.trim().length > 0) {
        sendBtn.disabled = false;
        sendBtn.style.opacity = '1';
      } else {
        sendBtn.disabled = true;
        sendBtn.style.opacity = '';
      }
    });

    promptEl.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        if (!sendBtn.disabled) {
          handleSend();
        }
      }
    });

    fileBtn.addEventListener('click', () => {
      uploadFile.click();
    });

    uploadFile.addEventListener('change', () => {
      if (uploadFile.files.length > 0) {
        const file = uploadFile.files[0];
        promptEl.value += `[Đính kèm file: ${file.name}] `;
        promptEl.dispatchEvent(new Event('input'));
        promptEl.focus();
      }
    });

    newChatBtn.addEventListener('click', () => {
      // Clear chat content except welcome screen
      const messages = chatContent.querySelectorAll('.message');
      messages.forEach(m => m.remove());
      welcomeScreen.classList.remove('hidden');
      promptEl.value = '';
      promptEl.style.height = 'auto';
      sendBtn.disabled = true;
      uploadFile.value = '';
      
      // CRITICAL: Clear memory so previous chat context isn't sent!
      conversationHistory = [];
      localStorage.removeItem('chat_history');
    });

    document.querySelectorAll('.suggestion-card').forEach(card => {
      card.addEventListener('click', () => {
        const text = card.getAttribute('data-prompt');
        promptEl.value = text;
        promptEl.dispatchEvent(new Event('input'));
        handleSend();
      });
    });

    function scrollToBottom() {
      chatContainer.scrollTop = chatContainer.scrollHeight;
    }

    function addMessage(role, content, artifacts = null) {
      welcomeScreen.classList.add('hidden');
      
      const msgDiv = document.createElement('div');
      msgDiv.className = `message ${role}`;
      
      let innerHTML = '';
      
      if (role === 'assistant') {
        const htmlContent = (typeof marked !== 'undefined') ? marked.parse(content || '') : escapeHTML(content);
        innerHTML += `
          <div class="avatar assistant">AI</div>
          <div class="message-bubble">
            <div class="markdown-content">${htmlContent}</div>
            ${renderArtifactsHTML(artifacts)}
          </div>
        `;
      } else {
        innerHTML += `
          <div class="message-bubble">${escapeHTML(content)}</div>
        `;
      }
      
      msgDiv.innerHTML = innerHTML;
      chatContent.appendChild(msgDiv);
      scrollToBottom();
      return msgDiv;
    }

    function addTypingIndicator() {
      welcomeScreen.classList.add('hidden');
      const msgDiv = document.createElement('div');
      msgDiv.className = `message assistant id-typing`;
      msgDiv.innerHTML = `
        <div class="avatar assistant">AI</div>
        <div class="message-bubble">
          <div class="typing-indicator">
            <div class="typing-dot"></div>
            <div class="typing-dot"></div>
            <div class="typing-dot"></div>
          </div>
        </div>
      `;
      chatContent.appendChild(msgDiv);
      scrollToBottom();
      return msgDiv;
    }

    function removeTypingIndicator() {
      const el = chatContent.querySelector('.id-typing');
      if (el) el.remove();
    }

    function escapeHTML(str) {
      if (!str) return '';
      return str
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function renderArtifactsHTML(artifacts) {
      if (!artifacts) return '';
      let html = '';

      if (artifacts.debug) {
        let dbg = artifacts.debug;
        html += `
          <div class="artifact-box" style="background-color: #1e1e1e; font-family: monospace; border-left: 3px solid #ffab00;">
            <strong style="color: #ffab00; font-size: 13px;">⚙️ System Diagnostics (Debug Mode)</strong>
            <details style="margin-top: 8px; margin-bottom: 6px;">
              <summary style="cursor: pointer; color: #a4c2f4; font-size: 13px;">1. Memory & Facts (${dbg.extracted_facts ? dbg.extracted_facts.length : 0} learned)</summary>
              <pre style="margin-top: 6px; padding: 8px; background: #000; border-radius: 4px;">${JSON.stringify(dbg.extracted_facts, null, 2)}</pre>
            </details>
            <details style="margin-bottom: 6px;">
              <summary style="cursor: pointer; color: #a4c2f4; font-size: 13px;">2. Intent Parser Output</summary>
              <pre style="margin-top: 6px; padding: 8px; background: #000; border-radius: 4px;">${JSON.stringify(dbg.intent_raw, null, 2)}</pre>
            </details>
            <details style="margin-bottom: 6px;">
              <summary style="cursor: pointer; color: #a4c2f4; font-size: 13px;">3. Planner Output (Skills to execute)</summary>
              <pre style="margin-top: 6px; padding: 8px; background: #000; border-radius: 4px;">${JSON.stringify(dbg.plan_raw, null, 2)}</pre>
            </details>
            <details>
              <summary style="cursor: pointer; color: #a4c2f4; font-size: 13px;">4. LLM Attempts & Telemetry</summary>
              <pre style="margin-top: 6px; padding: 8px; background: #000; border-radius: 4px;">${JSON.stringify(dbg.planner_used, null, 2)}</pre>
            </details>
          </div>
        `;
      }
      
      // The backend nests tool outputs under artifacts.skill_output, but might extract some to root as well.
      const skillOut = Object.assign({}, artifacts, artifacts.skill_output || {});

      // Handle image URLs (either single string or array)
      let urls = [];
      if (skillOut.image_urls && Array.isArray(skillOut.image_urls)) {
          urls = skillOut.image_urls;
      } else if (skillOut.image_url) {
          urls = [skillOut.image_url];
      }

      if (urls.length > 0) {
        html += `<div class="artifact-box"><strong>Images from Web</strong><div style="display:flex;flex-wrap:wrap;gap:8px;">`;
        urls.forEach(url => {
           html += `<img src="${url}" style="width:calc(50% - 4px);height:150px;object-fit:cover;border-radius:8px;cursor:pointer" onclick="window.open('${url}')" onerror="this.style.display='none'" />`;
        });
        html += `</div></div>`;
      }

      if (skillOut.report_markdown) {
        html += `
          <div class="artifact-box">
            <strong><svg viewBox="0 0 24 24" width="16" height="16" style="display:inline;vertical-align:bottom;margin-right:4px;"><path fill="currentColor" d="M14 2H6c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 1.99 2H18c1.1 0 2-.9 2-2V8l-6-6zm2 16H8v-2h8v2zm0-4H8v-2h8v2zm-3-5V3.5L18.5 9H13z"/></svg> Report</strong>
            <div class="markdown-content">${marked.parse(skillOut.report_markdown)}</div>
          </div>
        `;
      }

      if (skillOut.report_files) {
        html += `<div class="artifact-box"><strong>Attached Files</strong>`;
        if (skillOut.report_files.html_url) {
          html += `<a href="${skillOut.report_files.html_url}" target="_blank">View HTML Report</a><br/>`;
          html += `<iframe src="${skillOut.report_files.html_url}" loading="lazy"></iframe>`;
        }
        if (skillOut.report_files.pdf_url) {
          html += `<a href="${skillOut.report_files.pdf_url}" target="_blank">Download PDF Report</a>`;
        }
        html += `</div>`;
      }

      if (skillOut.image_base64) {
        // Handle array of base64 strings or single string
        const b64Array = Array.isArray(skillOut.image_base64) ? skillOut.image_base64 : [skillOut.image_base64];
        b64Array.forEach(b64 => {
            const isSvg = b64.trim().startsWith("PHN2Zy") || b64.trim().startsWith("PD94bWw");
            const mime = isSvg ? "image/svg+xml" : "image/png";
            html += `
              <div class="artifact-box">
                <strong>Generated Artifact</strong>
                <img src="data:${mime};base64,${b64}" alt="AI Gen" />
              </div>
            `;
        });
      }

      return html;
    }


    // In-memory + persistent conversation history
    let conversationHistory = JSON.parse(localStorage.getItem('chat_history') || '[]');

    function saveHistory() {
      localStorage.setItem('chat_history', JSON.stringify(conversationHistory.slice(-50)));
    }

    // Load history into UI on startup
    window.addEventListener('DOMContentLoaded', () => {
      conversationHistory.forEach(msg => {
        // We don't have artifacts in history easily for UI re-render here without more logic, 
        // but the 'context' is preserved for the next API call.
        // For now, just re-add text to UI.
        addMessage(msg.role, msg.content, null, true); // true = silent/no-animation
      });
    });

    async function handleSend() {
      const text = promptEl.value.trim();
      const file = uploadFile.files[0];
      if (!text && !file) return;

      // Add user message to UI
      addMessage('user', text || `[Uploaded file: ${file.name}]`);
      
      // Track in history
      conversationHistory.push({ role: 'user', content: text || `Uploaded: ${file?.name}` });
      saveHistory();

      // Cleanup input
      promptEl.value = '';
      promptEl.style.height = 'auto';
      sendBtn.disabled = true;
      
      // Show typing
      addTypingIndicator();

      const debug = debugMode.checked;
      let data = {};

      try {
        if (file) {
          const form = new FormData();
          form.append("message", text);
          form.append("file", file);
          form.append("conversation_history", JSON.stringify(conversationHistory.slice(-20)));
          form.append("force_new", "false");
          form.append("debug", String(debug));
          form.append("user_email", "tuanm7530@gmail.com");
          
          const res = await fetch("/api/v1/agents/chat/upload", {
            method: "POST",
            body: form,
          });
          data = await res.json();
          if (!res.ok) throw new Error(data.message || 'API Error');
        } else {
          const res = await fetch("/api/v1/agents/chat", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              message: text,
              force_new: false,
              debug: debug,
              user_email: "tuanm7530@gmail.com",
              conversation_history: conversationHistory.slice(-20), // last 20 turns
            }),
          });
          data = await res.json();
          if (!res.ok) throw new Error(data.message || 'API Error');
        }


        removeTypingIndicator();
        const replyText = data.reply || "Done.";
        addMessage('assistant', replyText, data.artifacts);

        // Store assistant response in history (including report for context)
        conversationHistory.push({
          role: 'assistant',
          content: replyText,
          report_markdown: data.artifacts?.report_markdown || null,
          image_base64: data.artifacts?.image_base64 || null,
        });
        saveHistory();

      } catch (err) {
        removeTypingIndicator();
        addMessage('assistant', `⚠️ Lỗi: ${err.message}`);
      }
      
      // Reset file input
      uploadFile.value = '';
    }
  </script>
</body>
</html>
